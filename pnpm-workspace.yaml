# pnpm 11 fails the install outright when a dependency's build script is
# neither approved nor refused (ERR_PNPM_IGNORED_BUILDS), so the decision has
# to be recorded here rather than left implicit.
#
# esbuild: vitest bundles the test files with it, so its binary is required.
# puppeteer is deliberately absent — it is only used by the gentest/fuzz
# scripts against real Chrome, never by `pnpm test`, so CI skips the ~150MB
# Chromium download.
onlyBuiltDependencies:
  - esbuild

# Approving is only half of it: pnpm errors on any build it was never told
# about, so the refusals have to be explicit too.
ignoredBuiltDependencies:
  - puppeteer
