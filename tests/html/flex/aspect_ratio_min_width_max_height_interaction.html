<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../support/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../support/test_base_style.css">
  <title>
    Aspect-ratio transferring through simultaneous min-width and max-height constraints on flex children
  </title>
</head>
<body>

<div id="test-root" style="display: flex; align-items: flex-start; width: 300px; height: 200px;">
  <div style="flex-grow: 1; aspect-ratio: 2; min-width: 120px; max-height: 50px;"></div>
  <div style="width: 60px; aspect-ratio: 0.5; max-height: 90px;"></div>
  <div style="flex-grow: 1; flex-basis: 0px; aspect-ratio: 1; min-width: 40px;"></div>
</div>

</body>
</html>
