  max-content). Blink applies that rule to an absolutely positioned auto-width
  flex root before final layout, so its soft-wrapping content uses the definite
  containing-block width rather than always taking its max-content width.
  Regenerate with: pnpm gentest fuzz_abspos_flex_root_fit_content_width
-->
