<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../support/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../support/test_base_style.css">
  <title>
    Column-dense auto flow combined with negative line placement and a span crossing into implicit tracks
  </title>
</head>
<body>

<div id="test-root" style="display: grid; grid-auto-flow: column dense; grid-template-columns: 40px 40px 40px; grid-template-rows: 40px 40px; grid-auto-columns: 20px; gap: 4px;">
  <div style="grid-column-start: -2; grid-row-start: 1;"></div>
  <div style="grid-column-start: span 2;"></div>
  <div style="grid-row-start: span 2;"></div>
  <div></div>
  <div style="grid-column-start: 4;"></div>
  <div></div>
</div>

</body>
</html>
